<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ölkələrə Görə IPTV</title>
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: #121212; color: #fff; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 320px; background: #1e1e1e; display: flex; flex-direction: column; border-right: 1px solid #333; }
        .controls { padding: 10px; background: #252525; border-bottom: 1px solid #333; }
        select, input { width: 100%; padding: 8px; margin-bottom: 8px; background: #333; color: #fff; border: 1px solid #444; border-radius: 4px; font-size: 14px; }
        #channel-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex: 1; }
        #channel-list li { padding: 10px 12px; cursor: pointer; border-bottom: 1px solid #2a2a2a; font-size: 14px; }
        #channel-list li:hover { background: #333; color: #00fff0; }
        #player-container { flex: 1; display: flex; justify-content: center; align-items: center; background: #000; }
        video { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="controls">
            <label style="font-size: 12px; color: #aaa;">Ölkəni seçin:</label>
            <select id="country-select" onchange="loadCountryPlaylist()">
                <option value="az">Azərbaycan (AZ)</option>
                <option value="tr">Türkiyə (TR)</option>
                <option value="us">ABŞ (US)</option>
                <option value="ru">Rusiya (RU)</option>
                <option value="de">Almaniya (DE)</option>
                <option value="gb">Böyük Britaniya (UK)</option>
                <option value="it">İtaliya (IT)</option>
                <option value="fr">Fransa (FR)</option>
                <option value="es">İspaniya (ES)</option>
            </select>
            <input type="text" id="search" placeholder="Kanal axtar..." onkeyup="filterChannels()">
        </div>
        <ul id="channel-list">Yüklənir...</ul>
    </div>

    <div id="player-container" style="position: relative;">
    <img src="https://i.ibb.co/ccPFsQ29/image.png" style="position: absolute; top: 15px; right: 15px; z-index: 10; width: 70px; opacity: 0.85; pointer-events: none;">
    <video id="iptv-player" class="video-js vjs-default-skin" controls autoplay preload="auto"></video>

    <script src="https://vjs.zencdn.net/7.20.3/video.js"></script>
    <script>
        let currentChannels = [];
        const player = videojs('iptv-player');

        async function loadCountryPlaylist() {
            const countryCode = document.getElementById('country-select').value;
            const listElement = document.getElementById('channel-list');
            listElement.innerHTML = '<li style="padding:10px;">Kanallar yüklənir...</li>';
            
            const url = `https://iptv-org.github.io/iptv/countries/${countryCode}.m3u`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error();
                const data = await response.text();
                parseM3U(data);
            } catch (error) {
                listElement.innerHTML = '<li style="padding:10px; color:red;">Bu ölkə üçün kanal tapılmadı.</li>';
            }
        }

        function parseM3U(m3uText) {
            const lines = m3uText.split('\n');
            currentChannels = [];
            let currentName = '';
            
            lines.forEach(line => {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const parts = line.split(',');
                    currentName = parts[parts.length - 1];
                } else if (line.startsWith('http')) {
                    if (currentName) {
                        currentChannels.push({ name: currentName, url: line });
                        currentName = '';
                    }
                }
            });

            renderChannels(currentChannels);
        }

        function renderChannels(list) {
            const listElement = document.getElementById('channel-list');
            listElement.innerHTML = '';
            if (list.length === 0) {
                listElement.innerHTML = '<li style="padding:10px;">Kanal tapılmadı.</li>';
                return;
            }
            list.forEach(channel => {
                const li = document.createElement('li');
                li.textContent = channel.name;
                li.onclick = () => playChannel(channel.url);
                listElement.appendChild(li);
            });
        }

        function playChannel(url) {
            player.src({ src: url, type: 'application/x-mpegURL' });
            player.play();
        }

        function filterChannels() {
            const query = document.getElementById('search').value.toLowerCase();
            const filtered = currentChannels.filter(c => c.name.toLowerCase().includes(query));
            renderChannels(filtered);
        }

        // İlkin olaraq Azərbaycan kanallarını yüklə
        loadCountryPlaylist();
    </script>
</body>
</html>
