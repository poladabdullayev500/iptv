<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Kanallar</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #121212; color: #fff; display: flex; height: 100vh; }
        #sidebar { width: 320px; background: #1e1e1e; display: flex; flex-direction: column; border-right: 1px solid #333; }
        .controls { padding: 10px; background: #252525; }
        select, input { width: 100%; padding: 8px; margin-bottom: 8px; background: #333; color: #fff; border: 1px solid #444; border-radius: 4px; box-sizing: border-box; }
        #channel-list { flex: 1; overflow-y: auto; }
        .channel { padding: 10px; border-bottom: 1px solid #2a2a2a; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 14px; }
        .channel:hover { background: #333; }
        .channel img { width: 32px; height: 24px; object-fit: contain; background: #000; border-radius: 3px; }
        #player-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #000; padding: 15px; }
        video { width: 100%; max-width: 960px; max-height: 75vh; background: #000; }
        #now-playing { margin-top: 12px; font-size: 16px; color: #00e676; }
        @media (max-width: 768px) { body { flex-direction: column; } #sidebar { width: 100%; height: 55vh; } }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="controls">
        <select id="country-select"><option value="">Ölk?l?r yükl?nir...</option></select>
        <input type="text" id="search" placeholder="Kanal axtar...">
    </div>
    <div id="channel-list"></div>
</div>

<div id="player-container">
    <video id="video" controls autoplay></video>
    <div id="now-playing">Kanal seçin</div>
</div>

<script>
    const M3U_URL = 'https://iptv-org.github.io/iptv/index.country.m3u';
    let allChannels = [];
    const hls = new Hls();
    const video = document.getElementById('video');

    async function loadM3U() {
        const res = await fetch(M3U_URL);
        const text = await res.text();
        const lines = text.split('\n');
        let current = null;

        for (let line of lines) {
            line = line.trim();
            if (line.startsWith('#EXTINF:')) {
                const name = line.split(',').pop().trim();
                const groupMatch = line.match(/group-title="([^"]*)"/);
                const logoMatch = line.match(/tvg-logo="([^"]*)"/);
                current = {
                    name: name,
                    country: groupMatch ? groupMatch[1] : 'Dig?r',
                    logo: logoMatch ? logoMatch[1] : ''
                };
            } else if (line.startsWith('http') && current) {
                current.url = line;
                allChannels.push(current);
                current = null;
            }
        }
        populateCountries();
    }

    function populateCountries() {
        const countries = [...new Set(allChannels.map(c => c.country))].sort();
        const select = document.getElementById('country-select');
        select.innerHTML = '<option value="ALL">Bütün ölk?l?r (' + allChannels.length + ')</option>';
        countries.forEach(c => {
            if (!c) return;
            const opt = document.createElement('option');
            opt.value = c;
            opt.textContent = c;
            if (c === 'Azerbaijan') opt.selected = true;
            select.appendChild(opt);
        });
        renderChannels();
    }

    function renderChannels() {
        const country = document.getElementById('country-select').value;
        const query = document.getElementById('search').value.toLowerCase();
        const list = document.getElementById('channel-list');
        list.innerHTML = '';

        const filtered = allChannels.filter(c => {
            const matchCountry = country === 'ALL' || c.country === country;
            const matchSearch = c.name.toLowerCase().includes(query);
            return matchCountry && matchSearch;
        }).slice(0, 300);

        filtered.forEach(ch => {
            const div = document.createElement('div');
            div.className = 'channel';
            div.innerHTML = `<img src="${ch.logo}" onerror="this.style.display='none'"><span>${ch.name}</span>`;
            div.onclick = () => playChannel(ch);
            list.appendChild(div);
        });
    }

    function playChannel(ch) {
        document.getElementById('now-playing').textContent = `${ch.name} (${ch.country})`;
        if (Hls.isSupported()) {
            hls.loadSource(ch.url);
            hls.attachMedia(video);
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = ch.url;
        }
    }

    document.getElementById('country-select').onchange = renderChannels;
    document.getElementById('search').oninput = renderChannels;
    loadM3U();
</script>
</body>
</html>
