<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Player</title>
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: #121212; color: #fff; display: flex; height: 100vh; overflow: hidden; }
        #playlist { width: 300px; background: #1e1e1e; overflow-y: auto; border-right: 1px solid #333; padding: 10px; }
        #playlist input { width: 100%; padding: 8px; margin-bottom: 10px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px; }
        #channel-list { list-style: none; padding: 0; margin: 0; }
        #channel-list li { padding: 10px; cursor: pointer; border-bottom: 1px solid #2a2a2a; font-size: 14px; }
        #channel-list li:hover { background: #333; }
        #player-container { flex: 1; display: flex; justify-content: center; align-items: center; background: #000; }
        video { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="playlist">
        <input type="text" id="search" placeholder="Kanal axtar..." onkeyup="filterChannels()">
        <ul id="channel-list">Kanal yüklənir...</ul>
    </div>

    <div id="player-container">
        <video id="iptv-player" class="video-js vjs-default-skin" controls autoplay preload="auto"></video>
    </div>

    <script src="https://vjs.zencdn.net/7.20.3/video.js"></script>
    <script>
        const m3uUrl = "https://iptv-org.github.io/iptv/index.country.m3u";
        let channels = [];
        const player = videojs('iptv-player');

        async function loadPlaylist() {
            try {
                const response = await fetch(m3uUrl);
                const data = await response.text();
                parseM3U(data);
            } catch (error) {
                document.getElementById('channel-list').innerHTML = "Siyahı yüklənmədi.";
            }
        }

        function parseM3U(m3uText) {
            const lines = m3uText.split('\n');
            let currentName = '';
            
            lines.forEach(line => {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const nameMatch = line.split(',');
                    currentName = nameMatch[nameMatch.length - 1];
                } else if (line.startsWith('http')) {
                    if (currentName) {
                        channels.push({ name: currentName, url: line });
                        currentName = '';
                    }
                }
            });

            renderChannels(channels.slice(0, 500));
        }

        function renderChannels(list) {
            const listElement = document.getElementById('channel-list');
            listElement.innerHTML = '';
            list.forEach(channel => {
                const li = document.createElement('li');
                li.textContent = channel.name;
                li.onclick = () => playChannel(channel.url);
                listElement.appendChild(li);
            });
        }

        function playChannel(url) {
            player.src({ src: url, type: 'application/x-mpegURL' });
            player.play();
        }

        function filterChannels() {
            const query = document.getElementById('search').value.toLowerCase();
            const filtered = channels.filter(c => c.name.toLowerCase().includes(query));
            renderChannels(filtered.slice(0, 200));
        }

        loadPlaylist();
    </script>
</body>
</html>
